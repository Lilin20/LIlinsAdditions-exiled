name: Build Plugin
on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Mono & NuGet
        run: |
          sudo apt-get update -q
          sudo apt-get install -y mono-complete
          curl -L https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -o /usr/local/bin/nuget.exe
          echo '#!/bin/bash' | sudo tee /usr/local/bin/nuget
          echo 'mono /usr/local/bin/nuget.exe "$@"' | sudo tee -a /usr/local/bin/nuget
          sudo chmod +x /usr/local/bin/nuget
      - name: Download SL References
        run: |
          curl -L https://exmod-team.github.io/SL-References/Dev.zip -o references.zip
          unzip -q references.zip -d Verweise
      - name: Download ProjectMER
        run: |
          PMER_URL=$(curl -s https://api.github.com/repos/Michal78900/ProjectMER/releases/latest \
            | grep "browser_download_url.*ProjectMER\.dll" \
            | cut -d '"' -f 4)
          curl -L "$PMER_URL" -o Verweise/ProjectMER.dll
      - name: Restore NuGet packages
        run: nuget restore LilinsAdditions.Main/LilinsAdditions.Main.csproj
      - name: Build (Release)
        run: |
          msbuild LilinsAdditions.Main/LilinsAdditions.Main.csproj \
            /p:Configuration=Release \
            /p:Platform=AnyCPU \
            /p:ReferencePath="${GITHUB_WORKSPACE}/Verweise"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LilinsAdditions
          path: LilinsAdditions.Main/bin/Release/LilinsAdditions.Main.dll
